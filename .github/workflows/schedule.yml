name: Chay Bot Quet Gia

on:
  schedule:
    # Chạy từ 9h00 đến 14h55 (Giờ VN tương đương 02:00 - 07:55 UTC), Thứ 2 đến Thứ 6
    - cron: '*/5 2-7 * * 1-5'
  workflow_dispatch: # Cho phép bấm nút chạy thử thủ công bất cứ lúc nào

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v3

      - name: Cài đặt Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện
        run: |
          pip install pandas requests

      - name: Thực thi quét giá
        run: |
          python bot_worker.py
